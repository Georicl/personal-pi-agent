[project]
name = "personal-pi-scientific-figure-runtime"
version = "0.1.0"
description = "Reproducible scientific figure runtime for Personal Pi"
requires-python = ">=3.11,<3.15"
dependencies = [
  "lifelines>=0.30",
  "matplotlib>=3.10",
  "networkx>=3.4",
  "numpy>=2.2",
  "odfpy>=1.4",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pillow>=11",
  "plotnine>=0.14",
  "pyarrow>=18",
  "pypdf>=5",
  "pyxlsb>=1.0",
  "python-calamine>=0.3",
  "scikit-image>=0.25",
  "scipy>=1.14",
  "seaborn>=0.13",
  "statsmodels>=0.14",
  "tifffile>=2025.1",
  "xlrd>=2.0",
]

[tool.uv]
package = false
